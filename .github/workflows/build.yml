name: Build VocalStudioPro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "VocalStudioPro-Native-*-Source-v*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    timeout-minutes: 90

    env:
      JAVA_VERSION: "17"
      ANDROID_API_LEVEL: "37"
      ANDROID_BUILD_TOOLS: "37.0.0"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      # ============================================================
      # 4. Gradle cache/setup
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ============================================================
      # 5. Locate newest VocalStudioPro ZIP
      # ============================================================

      - name: Detect and validate VocalStudioPro source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "Searching VocalStudioPro source ZIP"
          echo "=========================================="

          zip="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'VocalStudioPro-Native-*-Source-v*.zip' \
              -print \
              | sort -V \
              | tail -n1
          )"

          if [[ -z "${zip:-}" || ! -s "$zip" ]]; then
            echo "::error::VocalStudioPro source ZIP not found."
            echo
            echo "Repository root contents:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Using ZIP:"
          echo "$(basename "$zip")"
          echo

          # --------------------------------------------------------
          # ZIP integrity
          # --------------------------------------------------------

          echo "Testing ZIP integrity..."

          unzip -tq "$zip"

          echo "ZIP integrity: OK"

          # --------------------------------------------------------
          # Extract
          # --------------------------------------------------------

          work="$RUNNER_TEMP/vocalstudiopro"

          rm -rf "$work"
          mkdir -p "$work"

          echo
          echo "Extracting source..."

          unzip -q "$zip" -d "$work"

          # --------------------------------------------------------
          # Detect project root
          # --------------------------------------------------------

          settings="$(
            find "$work" \
              -type f \
              -name 'settings.gradle.kts' \
              -print \
              -quit
          )"

          if [[ -z "${settings:-}" ]]; then
            echo "::error::settings.gradle.kts not found."
            echo
            echo "Extracted files:"
            find "$work" \
              -maxdepth 6 \
              -type f \
              -print \
              | sort \
              | head -300
            exit 1
          fi

          project="$(dirname "$settings")"

          echo
          echo "Detected Android project:"
          echo "$project"

          # --------------------------------------------------------
          # Helpers
          # --------------------------------------------------------

          require_file() {
            local f="$1"

            if [[ ! -s "$f" ]]; then
              echo "::error::Required file missing or empty: ${f#$project/}"
              exit 1
            fi

            echo "OK file: ${f#$project/}"
          }

          require_text() {
            local f="$1"
            local text="$2"
            local label="$3"

            if ! grep -Fq -- "$text" "$f"; then
              echo
              echo "::error::$label was not found in ${f#$project/}"
              echo "Expected:"
              echo "$text"
              echo
              echo "File:"
              sed -n '1,260p' "$f"
              exit 1
            fi

            echo "OK: $label"
          }

          # --------------------------------------------------------
          # Required project files
          # --------------------------------------------------------

          echo
          echo "Checking required files..."

          require_file "$project/settings.gradle.kts"
          require_file "$project/build.gradle.kts"
          require_file "$project/app/build.gradle.kts"
          require_file "$project/app/src/main/AndroidManifest.xml"
          require_file "$project/app/src/main/cpp/CMakeLists.txt"

          # --------------------------------------------------------
          # Validate Android project
          # --------------------------------------------------------

          echo
          echo "Checking Android configuration..."

          require_text \
            "$project/app/build.gradle.kts" \
            'compileSdk = 37' \
            'compileSdk 37'

          require_text \
            "$project/app/build.gradle.kts" \
            'targetSdk = 37' \
            'targetSdk 37'

          require_text \
            "$project/app/build.gradle.kts" \
            'versionName = "1.1.0"' \
            'versionName 1.1.0'

          require_text \
            "$project/app/build.gradle.kts" \
            'lifecycle-viewmodel-compose:2.12.0' \
            'Lifecycle ViewModel Compose 2.12.0'

          require_text \
            "$project/app/build.gradle.kts" \
            'ndkVersion = "28.2.13676358"' \
            'Android NDK 28.2.13676358'

          # --------------------------------------------------------
          # Ensure C++ sources exist
          # --------------------------------------------------------

          cpp_count="$(
            find "$project/app/src/main/cpp" \
              -type f \
              \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' \) \
              | wc -l
          )"

          if [[ "$cpp_count" -lt 1 ]]; then
            echo "::error::No native C/C++ DSP source files found."
            exit 1
          fi

          echo "OK: Native DSP sources = $cpp_count file(s)"

          # --------------------------------------------------------
          # Detect Gradle launcher
          # --------------------------------------------------------

          if [[ -x "$project/gradlew" ]]; then
            gradle_cmd="./gradlew"

          elif [[ -f "$project/gradlew" ]]; then
            chmod +x "$project/gradlew"
            gradle_cmd="./gradlew"

          elif command -v gradle >/dev/null 2>&1; then
            gradle_cmd="gradle"

          else
            echo "::error::Neither Gradle Wrapper nor system Gradle found."
            exit 1
          fi

          echo
          echo "Gradle command: $gradle_cmd"

          # --------------------------------------------------------
          # Outputs
          # --------------------------------------------------------

          {
            echo "project=$project"
            echo "source_zip=$zip"
            echo "gradle_cmd=$gradle_cmd"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "Source validation PASSED"
          echo "=========================================="

      # ============================================================
      # 6. Display project info
      # ============================================================

      - name: Show project configuration
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          echo "Project:"
          pwd

          echo
          echo "Java:"
          java -version

          echo
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          echo
          echo "CMake:"
          "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}/bin/cmake" --version

          echo
          echo "Gradle:"
          ${{ steps.source.outputs.gradle_cmd }} --version

      # ============================================================
      # 7. Clean old outputs
      # ============================================================

      - name: Clean build
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          ${{ steps.source.outputs.gradle_cmd }} \
            --no-daemon \
            --stacktrace \
            clean

      # ============================================================
      # 8. Build Debug
      # ============================================================

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          ${{ steps.source.outputs.gradle_cmd }} \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            --parallel \
            :app:assembleDebug

      # ============================================================
      # 9. Build Release
      # ============================================================

      - name: Build Release APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          ${{ steps.source.outputs.gradle_cmd }} \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            --parallel \
            :app:assembleRelease

      # ============================================================
      # 10. Verify APKs
      # ============================================================

      - name: Verify generated APKs
        id: apk
        shell: bash
        run: |
          set -Eeuo pipefail

          project="${{ steps.source.outputs.project }}"

          debug_apk="$(
            find "$project/app/build/outputs/apk/debug" \
              -type f \
              -name '*.apk' \
              -print \
              | head -n1
          )"

          release_apk="$(
            find "$project/app/build/outputs/apk/release" \
              -type f \
              -name '*.apk' \
              -print \
              | head -n1
          )"

          if [[ -z "${debug_apk:-}" || ! -s "$debug_apk" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [[ -z "${release_apk:-}" || ! -s "$release_apk" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "=========================================="
          echo "Generated APKs"
          echo "=========================================="

          ls -lh "$debug_apk"
          ls -lh "$release_apk"

          echo
          echo "SHA-256:"

          sha256sum "$debug_apk"
          sha256sum "$release_apk"

          {
            echo "debug_apk=$debug_apk"
            echo "release_apk=$release_apk"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 11. Copy artifacts to clean folder
      # ============================================================

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          out="$RUNNER_TEMP/VocalStudioPro-APKs"

          rm -rf "$out"
          mkdir -p "$out"

          cp \
            "${{ steps.apk.outputs.debug_apk }}" \
            "$out/VocalStudioPro-v1.1.0-debug.apk"

          cp \
            "${{ steps.apk.outputs.release_apk }}" \
            "$out/VocalStudioPro-v1.1.0-release.apk"

          sha256sum \
            "$out/VocalStudioPro-v1.1.0-debug.apk" \
            "$out/VocalStudioPro-v1.1.0-release.apk" \
            > "$out/SHA256SUMS.txt"

          echo "Prepared artifacts:"
          ls -lah "$out"

      # ============================================================
      # 12. Upload Debug APK
      # ============================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalStudioPro-v1.1.0-Debug
          path: ${{ runner.temp }}/VocalStudioPro-APKs/VocalStudioPro-v1.1.0-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 13. Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalStudioPro-v1.1.0-Release
          path: ${{ runner.temp }}/VocalStudioPro-APKs/VocalStudioPro-v1.1.0-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # 14. Upload checksums
      # ============================================================

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: VocalStudioPro-v1.1.0-SHA256
          path: ${{ runner.temp }}/VocalStudioPro-APKs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
