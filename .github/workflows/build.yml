name: Build VocalStudioPro StudioClean

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "VocalStudioPro-Native-*-Source-v*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: vocalstudiopro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      APP_VERSION: "1.1.0"
      GRADLE_FALLBACK_VERSION: "9.6.0"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"

    steps:
      # ------------------------------------------------------------
      # Current Node 24 based actions
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ------------------------------------------------------------
      # Detect source ZIP and extract project first.
      # No Gradle cache action is run before extraction.
      # ------------------------------------------------------------
      - name: Extract VocalStudioPro source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          preferred="$GITHUB_WORKSPACE/VocalStudioPro-Native-StudioClean-Source-v1.1.0.zip"

          if [[ -s "$preferred" ]]; then
            zip="$preferred"
          else
            zip="$(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name 'VocalStudioPro-Native-*-Source-v*.zip' \
                -print \
              | sort -V \
              | tail -n1
            )"
          fi

          if [[ -z "${zip:-}" || ! -s "$zip" ]]; then
            echo "::error::VocalStudioPro source ZIP was not found in repository root."
            echo "Repository root contents:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Using source ZIP: $(basename "$zip")"
          unzip -tq "$zip"

          work="$RUNNER_TEMP/vocalstudiopro-source"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$zip" -d "$work"

          settings="$(
            find "$work" \
              -type f \
              -name 'settings.gradle.kts' \
              -print \
              -quit
          )"

          if [[ -z "${settings:-}" ]]; then
            echo "::error::settings.gradle.kts not found after extracting source ZIP."
            find "$work" -maxdepth 6 -type f -print | sort | head -400
            exit 1
          fi

          project="$(dirname "$settings")"

          echo "Detected project root: $project"

          {
            echo "source_zip=$zip"
            echo "project=$project"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Validate project structure/configuration
      # ------------------------------------------------------------
      - name: Validate VocalStudioPro project
        shell: bash
        run: |
          set -Eeuo pipefail

          project="${{ steps.source.outputs.project }}"

          require_file() {
            local file="$1"
            [[ -s "$file" ]] || {
              echo "::error::Required file missing or empty: ${file#$project/}"
              exit 1
            }
            echo "OK file: ${file#$project/}"
          }

          require_text() {
            local file="$1"
            local text="$2"
            local label="$3"

            if ! grep -Fq -- "$text" "$file"; then
              echo "::error::$label was not found in ${file#$project/}"
              echo "Expected: $text"
              sed -n '1,260p' "$file"
              exit 1
            fi

            echo "OK: $label"
          }

          require_file "$project/settings.gradle.kts"
          require_file "$project/build.gradle.kts"
          require_file "$project/gradle.properties"
          require_file "$project/app/build.gradle.kts"
          require_file "$project/app/src/main/AndroidManifest.xml"
          require_file "$project/app/src/main/cpp/CMakeLists.txt"

          require_text \
            "$project/app/build.gradle.kts" \
            'compileSdk = 37' \
            'compileSdk 37'

          require_text \
            "$project/app/build.gradle.kts" \
            'targetSdk = 37' \
            'targetSdk 37'

          require_text \
            "$project/app/build.gradle.kts" \
            'versionName = "1.1.0"' \
            'versionName 1.1.0'

          require_text \
            "$project/app/build.gradle.kts" \
            'ndkVersion = "28.2.13676358"' \
            'NDK 28.2.13676358'

          cpp_count="$(
            find "$project/app/src/main/cpp" \
              -type f \
              \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' \) \
              | wc -l
          )"

          if [[ "$cpp_count" -lt 1 ]]; then
            echo "::error::No native C/C++ DSP source files were found."
            exit 1
          fi

          echo "Native DSP sources: $cpp_count"

      # ------------------------------------------------------------
      # Android 17 / API 37 package detection.
      # setup-android@v4 uses current command-line tools.
      # ------------------------------------------------------------
      - name: Detect Android 17 SDK packages
        id: android_packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          list="$RUNNER_TEMP/sdkmanager-list.txt"

          sdkmanager --list --channel=3 \
            | tr -d '\r' \
            > "$list"

          echo "Android 17 platform candidates:"
          grep -E 'platforms;android-(37([.][0-9]+)?|CinnamonBun)' "$list" || true

          platform="$(
            awk -F'|' '
              {
                p=$1
                gsub(/^[ \t]+|[ \t]+$/, "", p)
                if (p == "platforms;android-37" || p ~ /^platforms;android-37\.[0-9]+$/) print p
              }
            ' "$list" \
            | sort -V \
            | tail -n1
          )"

          if [[ -z "${platform:-}" ]]; then
            platform="$(
              awk -F'|' '
                {
                  p=$1
                  gsub(/^[ \t]+|[ \t]+$/, "", p)
                  if (p == "platforms;android-CinnamonBun") print p
                }
              ' "$list" \
              | head -n1
            )"
          fi

          if [[ -z "${platform:-}" ]]; then
            echo "::error::Android 17 / API 37 platform is not visible to sdkmanager."
            echo "Available platform packages:"
            awk -F'|' '
              {
                p=$1
                gsub(/^[ \t]+|[ \t]+$/, "", p)
                if (p ~ /^platforms;android-/) print p
              }
            ' "$list" | sort -V | uniq | tail -100
            exit 1
          fi

          build_tools="$(
            awk -F'|' '
              {
                p=$1
                gsub(/^[ \t]+|[ \t]+$/, "", p)
                if (p ~ /^build-tools;37\.[0-9]+\.[0-9]+$/) print p
              }
            ' "$list" \
            | sort -V \
            | tail -n1
          )"

          if [[ -z "${build_tools:-}" ]]; then
            echo "::error::Android SDK Build-Tools 37.x.x were not found."
            echo "Available recent Build Tools:"
            awk -F'|' '
              {
                p=$1
                gsub(/^[ \t]+|[ \t]+$/, "", p)
                if (p ~ /^build-tools;/) print p
              }
            ' "$list" | sort -V | uniq | tail -50
            exit 1
          fi

          build_tools_version="${build_tools#build-tools;}"

          echo "Selected platform: $platform"
          echo "Selected build tools: $build_tools"

          {
            echo "platform=$platform"
            echo "build_tools=$build_tools"
            echo "build_tools_version=$build_tools_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager --channel=3 \
            "platform-tools" \
            "${{ steps.android_packages.outputs.platform }}" \
            "${{ steps.android_packages.outputs.build_tools }}" \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -d "$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$SDK_ROOT/cmake/$CMAKE_VERSION"
          test -d "$SDK_ROOT/build-tools/${{ steps.android_packages.outputs.build_tools_version }}"

          echo "Installed platforms:"
          find "$SDK_ROOT/platforms" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort || true

          echo "Installed build tools:"
          find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort || true

      # ------------------------------------------------------------
      # Use project wrapper if present. If not, install Gradle 9.6
      # directly without gradle/actions/setup-gradle (Node 20).
      # ------------------------------------------------------------
      - name: Prepare Gradle
        id: gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          project="${{ steps.source.outputs.project }}"

          if [[ -f "$project/gradlew" ]]; then
            chmod +x "$project/gradlew"
            cmd="./gradlew"
            mode="wrapper"
          else
            gradle_home="$RUNNER_TEMP/gradle-$GRADLE_FALLBACK_VERSION"

            if [[ ! -x "$gradle_home/bin/gradle" ]]; then
              archive="$RUNNER_TEMP/gradle-$GRADLE_FALLBACK_VERSION-bin.zip"

              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-delay 3 \
                --output "$archive" \
                "https://services.gradle.org/distributions/gradle-$GRADLE_FALLBACK_VERSION-bin.zip"

              unzip -q "$archive" -d "$RUNNER_TEMP"
            fi

            echo "$gradle_home/bin" >> "$GITHUB_PATH"
            cmd="gradle"
            mode="downloaded"
          fi

          echo "Gradle mode: $mode"

          {
            echo "cmd=$cmd"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - name: Configure local.properties
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          cat > local.properties <<EOF
          sdk.dir=$SDK_ROOT
          ndk.dir=$SDK_ROOT/ndk/$NDK_VERSION
          EOF

          cat local.properties

      - name: Show build environment
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ${{ steps.gradle.outputs.cmd }} --version

          echo
          echo "CMake:"
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake/$CMAKE_VERSION/bin/cmake" --version

          echo
          echo "NDK:"
          cat "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/$NDK_VERSION/source.properties"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Clean project
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          ${{ steps.gradle.outputs.cmd }} \
            --no-daemon \
            --stacktrace \
            clean

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          ${{ steps.gradle.outputs.cmd }} \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            --parallel \
            :app:assembleDebug

      - name: Build Release APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail

          ${{ steps.gradle.outputs.cmd }} \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            --parallel \
            :app:assembleRelease

      # ------------------------------------------------------------
      # Find/verify/copy APKs
      # ------------------------------------------------------------
      - name: Collect APKs
        id: apks
        shell: bash
        run: |
          set -Eeuo pipefail

          project="${{ steps.source.outputs.project }}"
          out="$RUNNER_TEMP/VocalStudioPro-v$APP_VERSION"

          rm -rf "$out"
          mkdir -p "$out"

          debug_apk="$(
            find "$project/app/build/outputs/apk" \
              -type f \
              -name '*debug*.apk' \
              -print \
            | sort \
            | head -n1
          )"

          release_apk="$(
            find "$project/app/build/outputs/apk" \
              -type f \
              -name '*release*.apk' \
              -print \
            | sort \
            | head -n1
          )"

          if [[ -z "${debug_apk:-}" || ! -s "$debug_apk" ]]; then
            echo "::error::Debug APK was not generated."
            find "$project/app/build/outputs" -maxdepth 8 -type f -print | sort || true
            exit 1
          fi

          if [[ -z "${release_apk:-}" || ! -s "$release_apk" ]]; then
            echo "::error::Release APK was not generated."
            find "$project/app/build/outputs" -maxdepth 8 -type f -print | sort || true
            exit 1
          fi

          cp "$debug_apk" "$out/VocalStudioPro-v$APP_VERSION-debug.apk"
          cp "$release_apk" "$out/VocalStudioPro-v$APP_VERSION-release.apk"

          (
            cd "$out"
            sha256sum \
              "VocalStudioPro-v$APP_VERSION-debug.apk" \
              "VocalStudioPro-v$APP_VERSION-release.apk" \
              > SHA256SUMS.txt
          )

          echo "Final APK files:"
          ls -lah "$out"
          cat "$out/SHA256SUMS.txt"

          {
            echo "dir=$out"
            echo "debug=$out/VocalStudioPro-v$APP_VERSION-debug.apk"
            echo "release=$out/VocalStudioPro-v$APP_VERSION-release.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Validate APK manifests
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK_ROOT/build-tools/${{ steps.android_packages.outputs.build_tools_version }}/aapt"

          test -x "$AAPT"

          echo "Debug APK:"
          "$AAPT" dump badging "${{ steps.apks.outputs.debug }}" | head -40

          echo
          echo "Release APK:"
          "$AAPT" dump badging "${{ steps.apks.outputs.release }}" | head -40

      # ------------------------------------------------------------
      # Current Node 24 artifact action
      # ------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: VocalStudioPro-v1.1.0-Debug
          path: ${{ steps.apks.outputs.debug }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: VocalStudioPro-v1.1.0-Release
          path: ${{ steps.apks.outputs.release }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v7
        with:
          name: VocalStudioPro-v1.1.0-SHA256
          path: ${{ steps.apks.outputs.dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
