name: Build VocalStudioPro StudioClean

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "VocalStudioPro-Native-*-Source-v*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: vocalstudiopro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      APP_VERSION: "1.1.1"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.22.1"
      BUILD_TOOLS_VERSION: "36.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and validate source ZIP
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          preferred="$GITHUB_WORKSPACE/VocalStudioPro-Native-StudioClean-Source-v1.1.1-CI-Fixed.zip"
          if [[ -s "$preferred" ]]; then
            zip="$preferred"
          else
            zip="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              -name 'VocalStudioPro-Native-*-Source-v*.zip' -print \
              | sort -V | tail -n1)"
          fi

          if [[ -z "${zip:-}" || ! -s "$zip" ]]; then
            echo "::error::VocalStudioPro source ZIP not found in repository root."
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Using source ZIP: $(basename "$zip")"
          unzip -tq "$zip"

          work="$RUNNER_TEMP/vocalstudiopro-source"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$zip" -d "$work"

          settings="$(find "$work" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$settings" ]]; then
            echo "::error::settings.gradle.kts not found after extraction."
            find "$work" -maxdepth 6 -type f -print | sort | head -400
            exit 1
          fi

          project="$(dirname "$settings")"
          echo "Detected project root: $project"

          require_file() {
            local f="$1"
            [[ -s "$f" ]] || { echo "::error::Missing/empty: ${f#$project/}"; exit 1; }
            echo "OK file: ${f#$project/}"
          }

          require_text() {
            local f="$1" text="$2" label="$3"
            grep -Fq -- "$text" "$f" || {
              echo "::error::$label not found in ${f#$project/}"
              echo "Expected: $text"
              sed -n '1,260p' "$f"
              exit 1
            }
            echo "OK: $label"
          }

          require_file "$project/settings.gradle.kts"
          require_file "$project/build.gradle.kts"
          require_file "$project/gradle.properties"
          require_file "$project/gradlew"
          require_file "$project/app/build.gradle.kts"
          require_file "$project/app/src/main/AndroidManifest.xml"
          require_file "$project/app/src/main/cpp/CMakeLists.txt"

          require_text "$project/app/build.gradle.kts" 'compileSdk = 37' 'compileSdk 37'
          require_text "$project/app/build.gradle.kts" 'targetSdk = 37' 'targetSdk 37'
          require_text "$project/app/build.gradle.kts" 'versionName = "1.1.1"' 'versionName 1.1.1'
          require_text "$project/app/build.gradle.kts" 'lifecycle-viewmodel-compose:2.11.0' 'Lifecycle ViewModel Compose 2.11.0'
          require_text "$project/app/build.gradle.kts" 'lifecycle-runtime-compose:2.11.0' 'Lifecycle Runtime Compose 2.11.0'
          require_text "$project/app/build.gradle.kts" 'ndkVersion = "28.2.13676358"' 'NDK 28.2.13676358'
          require_text "$project/build.gradle.kts" 'com.android.application") version "9.4.0"' 'AGP 9.4.0'
          require_text "$project/build.gradle.kts" 'org.jetbrains.kotlin.plugin.compose") version "2.3.21"' 'Compose compiler/Kotlin 2.3.21'

          if grep -R -Fq '2.12.0' "$project" --include='*.gradle.kts' --include='*.toml'; then
            echo "::error::Invalid Lifecycle 2.12.0 reference still exists."
            grep -R -n -F '2.12.0' "$project" --include='*.gradle.kts' --include='*.toml' || true
            exit 1
          fi

          chmod +x "$project/gradlew"
          printf 'project=%s\nsource_zip=%s\n' "$project" "$zip" >> "$GITHUB_OUTPUT"

      - name: Install Android 17 toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          list="$RUNNER_TEMP/sdk-list.txt"
          sdkmanager --list --channel=3 | tr -d '\r' > "$list"

          platform="platforms;android-37.0"
          if ! grep -Fq "$platform" "$list"; then
            if grep -Fq 'platforms;android-CinnamonBun' "$list"; then
              platform='platforms;android-CinnamonBun'
            else
              echo "::error::Android 17 / API 37.0 SDK platform not available."
              grep -E 'platforms;android-(37|CinnamonBun)' "$list" || true
              exit 1
            fi
          fi

          sdkmanager --channel=3 \
            "platform-tools" \
            "$platform" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$SDK_ROOT/cmake/$CMAKE_VERSION"
          test -d "$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"

      - name: Configure SDK path
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          cat local.properties

      - name: Verify exact Gradle and toolchain
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail
          java -version
          ./gradlew --version | tee "$RUNNER_TEMP/gradle-version.txt"
          grep -Fq 'Gradle 9.6.0' "$RUNNER_TEMP/gradle-version.txt"
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake/$CMAKE_VERSION/bin/cmake" --version
          cat "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/$NDK_VERSION/source.properties"

      - name: Build Debug and Release APKs
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            clean :app:assembleDebug :app:assembleRelease

      - name: Collect and validate APKs
        id: apks
        shell: bash
        run: |
          set -Eeuo pipefail
          project="${{ steps.source.outputs.project }}"
          out="$RUNNER_TEMP/VocalStudioPro-v$APP_VERSION"
          rm -rf "$out"
          mkdir -p "$out"

          debug="$(find "$project/app/build/outputs/apk" -type f -name '*debug*.apk' -print | sort | head -n1)"
          release="$(find "$project/app/build/outputs/apk" -type f -name '*release*.apk' -print | sort | head -n1)"

          [[ -s "$debug" ]] || { echo "::error::Debug APK not generated."; exit 1; }
          [[ -s "$release" ]] || { echo "::error::Release APK not generated."; exit 1; }

          cp "$debug" "$out/VocalStudioPro-v$APP_VERSION-debug.apk"
          cp "$release" "$out/VocalStudioPro-v$APP_VERSION-release.apk"

          AAPT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/$BUILD_TOOLS_VERSION/aapt"
          "$AAPT" dump badging "$out/VocalStudioPro-v$APP_VERSION-debug.apk" | head -40
          "$AAPT" dump badging "$out/VocalStudioPro-v$APP_VERSION-release.apk" | head -40

          (cd "$out" && sha256sum *.apk > SHA256SUMS.txt)
          cat "$out/SHA256SUMS.txt"
          printf 'dir=%s\n' "$out" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: VocalStudioPro-v1.1.1-APKs
          path: |
            ${{ steps.apks.outputs.dir }}/*.apk
            ${{ steps.apks.outputs.dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
