name: Build VocalStudioPro UniversalVoice v1.3.2

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'VocalStudioPro-UniversalVoice-v1.3.2*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: vocalstudiopro-v132-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: '28.2.13676358'
      CMAKE_VERSION: '3.22.1'
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Locate and extract source ZIP
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          preferred="$GITHUB_WORKSPACE/VocalStudioPro-UniversalVoice-v1.3.2-CoreIO-Final.zip"
          if [[ -s "$preferred" ]]; then
            zip="$preferred"
          else
            zip="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              -name 'VocalStudioPro-UniversalVoice-v1.3.2*.zip' \
              -print | sort -V | tail -n1 || true)"
          fi

          if [[ -z "${zip:-}" || ! -s "$zip" ]]; then
            echo '::error::VocalStudioPro v1.3.2 source ZIP not found in repository root.'
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          echo "Using source ZIP: $(basename "$zip")"
          unzip -tq "$zip"

          work="$RUNNER_TEMP/vocalstudiopro-v132"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$zip" -d "$work"

          settings="$(find "$work" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$settings" ]]; then
            echo '::error::settings.gradle.kts not found after extraction.'
            find "$work" -maxdepth 6 -type f -print | sort | head -400
            exit 1
          fi

          project="$(dirname "$settings")"
          echo "Detected project root: $project"

          test -s "$project/build.gradle.kts"
          test -s "$project/app/build.gradle.kts"
          test -s "$project/app/src/main/cpp/CMakeLists.txt"
          test -s "$project/app/src/main/java/com/mustafa/vocalstudio/voice/VoiceConversionEngine.kt"
          test -s "$project/app/src/main/java/com/mustafa/vocalstudio/voice/VoiceModelManager.kt"
          test -s "$project/app/src/main/java/com/mustafa/vocalstudio/voice/OnnxModelProbe.kt"

          grep -Fq 'compileSdk = 37' "$project/app/build.gradle.kts"
          grep -Fq 'targetSdk = 37' "$project/app/build.gradle.kts"
          grep -Fq 'versionName = "1.3.2"' "$project/app/build.gradle.kts"
          grep -Fq 'versionCode = 7' "$project/app/build.gradle.kts"
          grep -Fq 'lifecycle-viewmodel-compose:2.11.0' "$project/app/build.gradle.kts"
          grep -Fq 'onnxruntime-android:1.29.0' "$project/app/build.gradle.kts"
          grep -Fq 'ndkVersion = "28.2.13676358"' "$project/app/build.gradle.kts"
          grep -Fq 'VERSION="9.6.0"' "$project/gradlew"

          chmod +x "$project/gradlew"

          {
            echo "project=$project"
            echo "source_zip=$zip"
          } >> "$GITHUB_OUTPUT"

      - name: Install Android toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 \
            'platform-tools' \
            'platforms;android-37.0' \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
          test -d "$SDK_ROOT/ndk/$NDK_VERSION"
          test -d "$SDK_ROOT/cmake/$CMAKE_VERSION"

      - name: Configure SDK path
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Verify build environment
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail
          java -version
          ./gradlew --version
          ./gradlew --version | grep -F 'Gradle 9.6'
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake/$CMAKE_VERSION/bin/cmake" --version
          cat "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/$NDK_VERSION/source.properties"

      - name: Build Debug and Release APKs
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -Eeuo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache \
            clean \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify APK outputs
        id: apks
        shell: bash
        run: |
          set -Eeuo pipefail
          project='${{ steps.source.outputs.project }}'
          mapfile -t apks < <(find "$project/app/build/outputs/apk" -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo '::error::No APK output was produced.'
            find "$project/app/build/outputs" -maxdepth 8 -type f -print | sort || true
            exit 1
          fi
          printf '%s\n' "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: VocalStudioPro-v1.3.2-APKs
          path: ${{ steps.source.outputs.project }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
